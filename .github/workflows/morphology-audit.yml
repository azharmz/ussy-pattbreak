name: Extract morphology audit slice

on:
  workflow_dispatch:
    inputs:
      morphology_run_id:
        description: Successful RAW_ONEIL_MORPHOLOGY workflow run ID
        required: true
        default: "35428239292"
      security_id:
        description: Exact security_id to extract
        required: true

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MORPHOLOGY_RUN_ID: ${{ inputs.morphology_run_id }}
      SECURITY_ID: ${{ inputs.security_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen morphology checkpoint
        uses: actions/download-artifact@v4
        with:
          name: raw-oneil-morphology-${{ env.MORPHOLOGY_RUN_ID }}
          path: upstream
          run-id: ${{ env.MORPHOLOGY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Extract security morphology
        run: python scripts/extract_morphology_security.py --security-id "$SECURITY_ID" --output audit/morphology-security.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: morphology-audit-${{ env.SECURITY_ID }}-${{ github.run_id }}
          path: audit/morphology-security.jsonl
          if-no-files-found: error
          retention-days: 7
