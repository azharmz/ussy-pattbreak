name: Reset dashboard D1 clean schema
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET_D1 to destroy and rebuild dashboard D1 serving tables
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  reset:
    if: ${{ inputs.confirm == 'RESET_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install --no-save wrangler
      - name: Reset remote D1
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ussy-pattern-breakout-dashboard --remote --file=d1/reset-clean.sql
      - name: Rebuild clean projection from immutable R2
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_SYNC_TOKEN: ${{ secrets.DASHBOARD_SYNC_TOKEN }}
        run: |
          test -n "$DASHBOARD_SYNC_TOKEN"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $DASHBOARD_SYNC_TOKEN" https://ussy-pattern-breakout.pages.dev/api/admin/sync | tee /tmp/sync.json
          node -e 'const x=require("/tmp/sync.json"); if(x.status!=="READY"||x.schema_version!=="dashboard-projection-v13-clean"||x.opportunities!==0||x.breakout_events!==48||x.positions!==20) process.exit(1)'
      - name: Verify production health
        run: |
          curl --fail-with-body -sS https://ussy-pattern-breakout.pages.dev/api/health | tee /tmp/health.json
          node -e 'const x=require("/tmp/health.json"); if(x.status!=="READY"||x.latest_projection?.schema_version!=="dashboard-projection-v13-clean"||x.opportunity_count!==0||x.breakout_event_count!==48) process.exit(1)'
      - name: Verify clean schema
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute ussy-pattern-breakout-dashboard --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
