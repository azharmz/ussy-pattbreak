name: Research CWH 3Y training scan
on:
  push:
    branches: [main]
    paths: [.github/dispatch/research-cwh-3y]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      ONEIL_SHA: c433cc1e35a5aa32a46f732cd8c5545935e36e40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . pandas pyarrow boto3
      - uses: actions/checkout@v4
        with:
          repository: azharmz/ussy-oneil-patterns
          ref: ${{ env.ONEIL_SHA }}
          path: _frozen/ussy-oneil-patterns
          persist-credentials: false
      - run: pip install ./_frozen/ussy-oneil-patterns
      - name: Scan canonical history/ohlcv over last 3 years
        run: |
          python - <<'PY'
          import boto3, io, json, os, pandas as pd
          from oneil_patterns.data.r2_ready import ReadyDataset
          from oneil_patterns.production.engine import analyze_security
          from oneil_patterns.production.runner import run_ready_dataset
          s3=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          b=os.environ["R2_BUCKET_NAME"]
          keys=[]
          for page in s3.get_paginator("list_objects_v2").paginate(Bucket=b,Prefix="history/ohlcv/"):
            keys += [x["Key"] for x in page.get("Contents",[]) if x["Key"].endswith(".parquet")]
          records=[]; errors=[]
          for i,key in enumerate(keys,1):
            sid=key.rsplit("/",1)[-1].removesuffix(".parquet")
            try:
              df=pd.read_parquet(io.BytesIO(s3.get_object(Bucket=b,Key=key)["Body"].read()))
              df["date"]=pd.to_datetime(df["date"],errors="raise").dt.tz_localize(None).dt.normalize()
              end=df["date"].max(); start=end-pd.Timedelta(days=1096)
              df=df[(df["date"]>=start)&(df["date"]<=end)].copy()
              if len(df)<30: continue
              # production runner contract; one security per canonical history object
              ds=ReadyDataset(frame=df,manifest={"schema_version":2,"parquet_key":key,"sha256":"research-history-object","security_ids":[sid],"rows":len(df),"as_of_date":end.date().isoformat()})
              res=run_ready_dataset(ds,asof_date=end.date(),analyze_security=analyze_security)
              for line in res.jsonl.splitlines():
                x=json.loads(line)
                if x.get("pattern")=="CUP_WITH_HANDLE" and x.get("normalized_status")=="RECOGNIZED":
                  x["_history_key"]=key; x["_window_start"]=start.date().isoformat(); x["_window_end"]=end.date().isoformat()
                  records.append(x)
            except Exception as e: errors.append({"security_id":sid,"key":key,"error":str(e)[:500]})
            if i%50==0: print(f"SCAN {i}/{len(keys)} cwh={len(records)} errors={len(errors)}",flush=True)
          payload={"engine_sha":os.environ["ONEIL_SHA"],"history_files":len(keys),"recognized_cwh":len(records),"errors":errors,"results":records}
          open("research-cwh-3y.json","w").write(json.dumps(payload,indent=2))
          print(json.dumps({"history_files":len(keys),"recognized_cwh":len(records),"errors":len(errors),"sample":records[:3]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-cwh-3y-${{ github.run_id }}
          path: research-cwh-3y.json
          retention-days: 7
