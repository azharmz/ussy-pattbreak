name: Research CWH precision audit
on:
  push:
    branches: [main]
    paths: [.github/dispatch/research-cwh-precision-audit]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      GH_TOKEN: ${{ github.token }}
      C433_SHA: c433cc1e35a5aa32a46f732cd8c5545935e36e40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pattbreak tooling
        run: pip install -e . pandas pyarrow boto3
      - name: Checkout frozen engine and HEAD engine
        run: |
          git clone --quiet https://github.com/azharmz/ussy-oneil-patterns.git _engine/c433
          git -C _engine/c433 checkout --quiet "$C433_SHA"
          git clone --quiet https://github.com/azharmz/ussy-oneil-patterns.git _engine/head
          git -C _engine/head checkout --quiet main
      - name: Download canonical history/ohlcv
        run: |
          mkdir -p history/ohlcv
          aws s3 sync "s3://${R2_BUCKET_NAME}/history/ohlcv/" history/ohlcv/             --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          echo "history files: $(find history/ohlcv -name '*.parquet' | wc -l)"
      - name: Download old artifact
        run: |
          mkdir -p old-artifact
          gh run download 36122641409 --repo "$GITHUB_REPOSITORY"             --name research-cwh-3y-36122641409 --dir old-artifact
          ls -lh old-artifact
      - name: Install c433 and run exact research scan
        run: |
          pip install ./_engine/c433
          python scripts/research_cwh_scan.py --history-dir history/ohlcv             --window-years 3 --out-dir results/cwh-3y-c433cc1 --workers 4 2>&1 | tee c433-scan.log
          grep 'selesai:' c433-scan.log | tail -1
          python - <<'PY'
          import json,sys
          p='results/cwh-3y-c433cc1/research-cwh-3y.json'
          d=json.load(open(p))
          mism=sum(x.get('price_check')!='OK' for x in d['results'])
          print('c433 price_check MISMATCH =', mism)
          if mism:
              sys.exit('STOP: price_check MISMATCH != 0')
          PY
      - name: Verify c433 against old artifact
        run: |
          python - <<'PY'
          import json,glob
          old=json.load(open(glob.glob('old-artifact/*.json')[0]))
          new=json.load(open('results/cwh-3y-c433cc1/research-cwh-3y.json'))
          oi={x['assessment_id'] for x in old['results']}; ni={x['assessment_id'] for x in new['results']}
          print('OLD assessments:',len(old['results']))
          print('NEW c433 assessments:',len(new['results']))
          print('assessment_id missing from new:',len(oi-ni))
          print('assessment_id extra in new:',len(ni-oi))
          if len(old['results']) != len(new['results']) or oi != ni:
              print('ASSESSMENT_ID_DIFFERENCE=YES')
          else:
              print('ASSESSMENT_ID_DIFFERENCE=NO')
          PY
      - name: Analyze c433 scan
        run: python scripts/analyze_cwh_scan.py results/cwh-3y-c433cc1/research-cwh-3y.json --out results/cwh-3y-c433cc1/analysis
      - name: Install HEAD and run exact research scan
        run: |
          pip uninstall -y ussy-pattern-breakout oneil-patterns || true
          pip install ./_engine/head
          python scripts/research_cwh_scan.py --history-dir history/ohlcv             --window-years 3 --out-dir results/cwh-3y-head --workers 4 2>&1 | tee head-scan.log
          grep 'selesai:' head-scan.log | tail -1
          python - <<'PY'
          import json,sys
          p='results/cwh-3y-head/research-cwh-3y.json'
          d=json.load(open(p))
          mism=sum(x.get('price_check')!='OK' for x in d['results'])
          print('HEAD price_check MISMATCH =', mism)
          if mism:
              sys.exit('STOP: HEAD price_check MISMATCH != 0')
          PY
      - name: Analyze HEAD scan
        run: python scripts/analyze_cwh_scan.py results/cwh-3y-head/research-cwh-3y.json --out results/cwh-3y-head/analysis
      - name: Compare requested figures
        run: |
          python - <<'PY'
          from pathlib import Path
          for tag in ['cwh-3y-c433cc1','cwh-3y-head']:
              print(f'===== {tag} =====')
              print((Path('results')/tag/'analysis'/'summary.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cwh-precision-audit-${{ github.run_id }}
          path: results/
          retention-days: 7
