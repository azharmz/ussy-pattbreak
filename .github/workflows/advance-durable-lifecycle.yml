name: Advance durable lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/verify-durable-resume-trigger

permissions:
  contents: read

concurrency:
  group: pattern-breakout-production-lifecycle
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e . boto3
      - name: Advance durable lifecycle from current pointer
        run: PYTHONPATH=scripts python scripts/advance_durable_lifecycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ github.run_id }}
          path: |
            checkpoints/lifecycle.json
            checkpoints/lifecycle.jsonl
          if-no-files-found: error
          retention-days: 30
