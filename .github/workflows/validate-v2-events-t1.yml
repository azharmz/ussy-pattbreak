name: Validate v2 events and T1
on:
  workflow_dispatch:
  push:
    branches: [impl/v2-events-t1]
    paths: [.github/dispatch/validate-v2-events-t1]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . pytest boto3
      - run: pytest -q
