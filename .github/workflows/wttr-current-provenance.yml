name: Audit WTTR current breakout provenance
on:
  push:
    branches: [main]
    paths: [.github/dispatch/wttr-current-provenance]
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      SIGNALS_RUN_ID: "35685769349"
      SECURITY_ID: "US81617J3014"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas pyarrow boto3
      - uses: actions/download-artifact@v4
        with:
          name: daily-pattern-signals-${{ env.SIGNALS_RUN_ID }}
          path: upstream
          run-id: ${{ env.SIGNALS_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Restore exact immutable morphology JSONL
        run: |
          python - <<'PY'
          import boto3,gzip,json,os
          m=json.load(open("upstream/raw-oneil-morphology.json")); day=m["upstream_frozen_ready"]["as_of_date"]; h=m["morphology"]["jsonl_sha256"]
          s=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          b=s.get_object(Bucket=os.environ["R2_BUCKET_NAME"],Key=f"pattern-breakout/production/morphology/runs/{day}/{h}.jsonl.gz")["Body"].read()
          open("upstream/raw-oneil-morphology.jsonl","wb").write(gzip.decompress(b))
          PY
      - name: Audit exact event-builder semantics
        run: python scripts/audit_security_breakout_provenance.py --security-id "$SECURITY_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: wttr-current-provenance-${{ github.run_id }}
          path: audit/security-breakout-provenance.json
          retention-days: 7
          if-no-files-found: error
