name: Validate dashboard gzip storage

on:
  push:
    branches: ["storage/dashboard-gzip-v1"]
    paths:
      - "src/pattern_breakout/checkpoint_store_v1.py"
      - "tests/test_checkpoint_store_v1.py"
      - "web/**"
      - ".github/workflows/validate-dashboard-gzip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm run web:test
