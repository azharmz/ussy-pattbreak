name: Audit buy-zone pivot policy

on:
  push:
    branches:
      - audit/buy-zone-17sep
    paths:
      - .github/dispatch/buy-zone-17sep
  workflow_dispatch:
    inputs:
      morphology_run_id:
        required: true
        default: "35428239292"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MORPHOLOGY_RUN_ID: ${{ inputs.morphology_run_id || '35428239292' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas pyarrow boto3
      - uses: actions/download-artifact@v4
        with:
          name: raw-oneil-morphology-${{ env.MORPHOLOGY_RUN_ID }}
          path: upstream
          run-id: ${{ env.MORPHOLOGY_RUN_ID }}
          github-token: ${{ github.token }}
      - run: python scripts/audit_buy_zone_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: buy-zone-policy-${{ github.run_id }}
          path: audit/competing-pivots.json
          retention-days: 7
          if-no-files-found: error
