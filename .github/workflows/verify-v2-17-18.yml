name: Verify frozen v2 baselines 17-18 Sep
on:
  workflow_dispatch:
  push:
    branches: [audit/freeze-17-18-baselines]
    paths: [.github/dispatch/verify-v2-17-18]
permissions: {contents: read, actions: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - day: "2026-09-17"
            morphology_run_id: "35428239292"
          - day: "2026-09-18"
            morphology_run_id: "35588989249"
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . pandas pyarrow boto3
      - name: Download frozen 17 Sep morphology artifact
        if: matrix.day == '2026-09-17'
        uses: actions/download-artifact@v4
        with:
          name: raw-oneil-morphology-${{ matrix.morphology_run_id }}
          path: upstream
          run-id: ${{ matrix.morphology_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact 18 Sep daily metadata
        if: matrix.day == '2026-09-18'
        uses: actions/download-artifact@v4
        with:
          name: daily-pattern-signals-${{ matrix.morphology_run_id }}
          path: staged
          run-id: ${{ matrix.morphology_run_id }}
          github-token: ${{ github.token }}
      - name: Restore immutable 18 Sep morphology body from R2
        if: matrix.day == '2026-09-18'
        run: |
          mkdir -p upstream
          cp staged/frozen-ready.json upstream/
          cp staged/raw-oneil-morphology.json upstream/
          python - <<'PY'
          import boto3,gzip,json,os
          meta=json.load(open("upstream/raw-oneil-morphology.json"))
          key="pattern-breakout/production/morphology/runs/2026-09-18/6d943477192399dc27fcc979f95c09ecf02dcd318518104c5b13cfb65fea7fad.jsonl.gz"
          expected=meta["morphology"]["jsonl_sha256"]
          s=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          raw=s.get_object(Bucket=os.environ["R2_BUCKET_NAME"],Key=key)["Body"].read()
          if key.endswith(".gz"): raw=gzip.decompress(raw)
          import hashlib
          if hashlib.sha256(raw).hexdigest()!=expected: raise SystemExit("immutable 18 Sep morphology hash mismatch")
          open("upstream/raw-oneil-morphology.jsonl","wb").write(raw)
          PY
      - run: python scripts/build_breakout_events_v2_shadow.py --input-dir upstream --output-dir checkpoints
      - name: Report exact frozen result
        run: cat checkpoints/breakout-events-v2-summary.json
