name: Audit WTTR dashboard history
on:
  push:
    branches: [main]
    paths: [.github/dispatch/wttr-dashboard-history]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query WTTR across dashboard history
        run: |
          python - <<'PY'
          import json,urllib.request
          base="https://ussy-pattern-breakout.pages.dev"
          def get(p):
            with urllib.request.urlopen(base+p,timeout=20) as r:return json.load(r)
          h=get("/api/health")
          dates=sorted({x["signal_date"] for x in h.get("breakout_event_dates",[]) if x.get("signal_date")})
          out={"health":h,"wttr_events":[],"wttr_positions":[]}
          for d in dates:
            for x in get("/api/breakout-events?limit=500&signal_date="+d):
              if x.get("ticker")=="WTTR": out["wttr_events"].append(x)
          for x in get("/api/positions?limit=500"):
            if x.get("ticker")=="WTTR": out["wttr_positions"].append(x)
          open("wttr-dashboard-history.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"dates":dates,"wttr_events":len(out["wttr_events"]),"wttr_positions":len(out["wttr_positions"])},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wttr-dashboard-history-${{ github.run_id }}
          path: wttr-dashboard-history.json
          retention-days: 7
          if-no-files-found: error
