name: Audit pivot lifecycle

on:
  workflow_dispatch:
    inputs:
      morphology_run_id:
        required: true
        default: "35428239292"
      security_id:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MORPHOLOGY_RUN_ID: ${{ inputs.morphology_run_id || '35428239292' }}
      SECURITY_ID: ${{ inputs.security_id || 'US3687361044' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas pyarrow boto3
      - name: Download frozen morphology checkpoint
        uses: actions/download-artifact@v4
        with:
          name: raw-oneil-morphology-${{ env.MORPHOLOGY_RUN_ID }}
          path: upstream
          run-id: ${{ env.MORPHOLOGY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Reconstruct pivot lifecycle
        run: python scripts/audit_pivot_lifecycle.py --security-id "$SECURITY_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: pivot-lifecycle-${{ env.SECURITY_ID }}-${{ github.run_id }}
          path: audit/pivot-lifecycle.json
          if-no-files-found: error
          retention-days: 7
