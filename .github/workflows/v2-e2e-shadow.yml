name: Shadow v2 end-to-end reconciliation
on:
  workflow_dispatch:
    inputs:
      morphology_run_id: {required: true, default: "35428239292"}
      t1_run_id: {required: true, default: "35433809906"}
  push:
    branches: [shadow/v2-end-to-end-17sep]
    paths: [.github/dispatch/v2-e2e-17sep]
permissions: {contents: read, actions: read}
jobs:
  shadow:
    runs-on: ubuntu-latest
    env:
      MORPHOLOGY_RUN_ID: ${{ inputs.morphology_run_id || '35428239292' }}
      T1_RUN_ID: ${{ inputs.t1_run_id || '35433809906' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas pyarrow boto3
      - uses: actions/download-artifact@v4
        with:
          name: raw-oneil-morphology-${{ env.MORPHOLOGY_RUN_ID }}
          path: morphology
          run-id: ${{ env.MORPHOLOGY_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: t1-execution-${{ env.T1_RUN_ID }}
          path: t1
          run-id: ${{ env.T1_RUN_ID }}
          github-token: ${{ github.token }}
      - run: python scripts/build_breakout_events_v2_shadow.py --input-dir morphology --output-dir shadow
      - run: python scripts/build_v2_e2e_shadow.py --events shadow/breakout-events-v2.jsonl --t1 t1/t1-execution.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: v2-e2e-shadow-${{ github.run_id }}
          path: |
            audit/
            shadow/
          retention-days: 7
