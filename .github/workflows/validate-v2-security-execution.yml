name: Validate v2 security execution
on:
  workflow_dispatch:
  push:
    branches: [impl/v2-security-execution]
    paths: [.github/dispatch/validate-v2-security-execution]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e . pytest boto3
      - run: pytest -q
