name: Opportunity empirical audit read only

on:
  workflow_dispatch:
    inputs:
      signals_run_id:
        description: Exact successful Daily Pattern Breakout signals run ID
        required: true
        default: "35685769349"
  push:
    branches: [main]
    paths:
      - ".github/workflows/opportunity-audit-readonly.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALS_RUN_ID: "35685769349"
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . boto3 pyarrow
      - name: Download exact frozen signal artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-pattern-signals-35685769349
          path: upstream
          run-id: 35685769349
          github-token: ${{ github.token }}
      - name: Restore exact immutable morphology and READY
        run: |
          python - <<'PY'
          import boto3,gzip,hashlib,json,os
          from pathlib import Path
          u=Path("upstream")
          m=json.loads((u/"raw-oneil-morphology.json").read_text())
          f=json.loads((u/"frozen-ready.json").read_text())
          day=m["upstream_frozen_ready"]["as_of_date"]
          h=m["morphology"]["jsonl_sha256"]
          if day!="2026-09-21": raise ValueError("unexpected as-of "+day)
          if f["source_hash"]!=m["upstream_frozen_ready"]["source_hash"]: raise ValueError("READY lineage mismatch")
          s=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"],aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          b=os.environ["R2_BUCKET_NAME"]
          raw=gzip.decompress(s.get_object(Bucket=b,Key="pattern-breakout/production/morphology/runs/"+day+"/"+h+".jsonl.gz")["Body"].read())
          if hashlib.sha256(raw).hexdigest()!=h: raise ValueError("morphology checksum mismatch")
          (u/"raw-oneil-morphology.jsonl").write_bytes(raw)
          ready=s.get_object(Bucket=b,Key=f["ready"]["parquet_key"])["Body"].read()
          if hashlib.sha256(ready).hexdigest()!=f["source_hash"].replace("sha256:",""): raise ValueError("READY checksum mismatch")
          (u/"ready.parquet").write_bytes(ready)
          PY
      - name: Build exact evidence snapshot
        run: python scripts/build_dashboard_opportunity_snapshot.py --ready-parquet upstream/ready.parquet
      - name: Audit structural cardinality
        run: |
          mkdir -p audit-output
          python scripts/audit_opportunity_contract.py checkpoints/dashboard-opportunities.jsonl --expected-as-of 2026-09-21 --output audit-output/opportunity-contract-audit.json
          cp checkpoints/dashboard-opportunities.json audit-output/evidence-snapshot-metadata.json
          python scripts/research_opportunity_eligibility.py checkpoints/dashboard-opportunities.jsonl --output audit-output/opportunity-eligibility-research.json
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open("audit-output/opportunity-contract-audit.json"))
          c=x["cardinality"]; i=x["identity_checks"]
          print("# Opportunity empirical audit - 2026-09-21")
          print()
          print("Read-only evidence audit; no Opportunity eligibility rule introduced.")
          print()
          print("- assessment evidence rows:",c["assessment_rows"])
          print("- below-pivot assessments:",c["below_pivot_assessments"])
          print("- base IDs:",c["base_ids"])
          print("- setup keys:",c["setup_keys"])
          print("- lineage IDs:",c["lineage_ids"])
          print("- securities:",c["securities"])
          print("- base IDs spanning security/pivot:",i["base_ids_spanning_security_or_pivot"])
          print("- lineage IDs spanning security/pivot:",i["lineage_ids_spanning_security_or_pivot"])
          y=json.load(open("audit-output/opportunity-eligibility-research.json"))
          d=y["distributions"]; k=y["cardinality"]
          print()
          print("## Eligibility research (descriptive only)")
          print("- base IDs below pivot:",k["bases_below_pivot"])
          print("- base IDs at/above pivot:",k["bases_at_or_above_pivot"])
          print("- securities with multiple bases:",k["securities_with_multiple_bases"])
          print("- lineages with multiple bases:",k["lineages_with_multiple_bases"])
          print("- below-pivot gap quantiles:",d["below_pivot_gap_pct"])
          print("- descriptive below-pivot distance bands:",y["descriptive_distance_bands_below_pivot"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-empirical-audit-2026-09-21
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
