name: Audit first breakout

on:
  workflow_dispatch:
    inputs:
      morphology_run_id:
        required: true
        default: "35428239292"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MORPHOLOGY_RUN_ID: ${{ inputs.morphology_run_id || '35428239292' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas pyarrow boto3
      - name: Download frozen morphology checkpoint
        uses: actions/download-artifact@v4
        with:
          name: raw-oneil-morphology-${{ env.MORPHOLOGY_RUN_ID }}
          path: upstream
          run-id: ${{ env.MORPHOLOGY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Audit first qualifying breakout
        run: python scripts/audit_first_breakout.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-breakout-audit-${{ github.run_id }}
          path: audit/first-breakout-audit.json
          if-no-files-found: error
          retention-days: 7
