name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: pytest -q

  raw-morphology-production-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      ONEIL_SHA: c433cc1e35a5aa32a46f732cd8c5545935e36e40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . boto3
      - uses: actions/checkout@v4
        with:
          repository: azharmz/ussy-oneil-patterns
          ref: ${{ env.ONEIL_SHA }}
          path: _frozen/ussy-oneil-patterns
          persist-credentials: false
      - run: python -m pip install ./_frozen/ussy-oneil-patterns
      - run: python scripts/build_raw_morphology.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw-oneil-morphology-${{ github.run_id }}
          path: |
            checkpoints/frozen-ready.json
            checkpoints/raw-oneil-morphology.json
            checkpoints/raw-oneil-morphology.jsonl
          if-no-files-found: error
          retention-days: 30
