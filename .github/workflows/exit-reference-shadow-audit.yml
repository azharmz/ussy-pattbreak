name: Audit exit-reference shadow
on:
  workflow_dispatch:
    inputs:
      t1_run_id: {required: true, default: "35433809906"}
  push:
    branches: [audit/exit-reference-shadow-17sep]
    paths: [.github/dispatch/exit-reference-shadow-17sep]
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      T1_RUN_ID: ${{ inputs.t1_run_id || '35433809906' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas pyarrow boto3
      - uses: actions/download-artifact@v4
        with:
          name: t1-execution-${{ env.T1_RUN_ID }}
          path: upstream
          run-id: ${{ env.T1_RUN_ID }}
          github-token: ${{ github.token }}
      - run: python scripts/audit_exit_reference_shadow.py
      - uses: actions/upload-artifact@v4
        with:
          name: exit-reference-shadow-${{ github.run_id }}
          path: audit/exit-reference-shadow.json
          retention-days: 7
