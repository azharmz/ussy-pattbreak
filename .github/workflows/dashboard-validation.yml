name: Dashboard validation

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "src/pattern_breakout/checkpoint_store_v1.py"
      - "scripts/publish_durable_checkpoint.py"
      - "tests/test_checkpoint_store_v1.py"
      - ".github/workflows/*morphology.yml"
      - ".github/workflows/breakout-candidate.yml"
      - ".github/workflows/t1-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Core and durable checkpoint regression
        run: pytest -q
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check web/_worker.js
          node --check web/d1/projector.js
          node --check web/public/app.js
      - name: Guard forbidden pseudo-Core states
        run: |
          ! grep -R -E "morphology_status[^\n]*(NEAR_TRIGGER|PRE_BREAKOUT)|breakout_state[^\n]*(NEAR_TRIGGER|PRE_BREAKOUT)" web
