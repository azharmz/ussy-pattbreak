name: Publish dashboard serving shards

on:
  workflow_dispatch:
  push:
    branches: ["dispatch/dashboard-serving-shards-20260920"]
    paths: [".dashboard-serving-dispatch"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e . boto3
      - name: Publish additive serving shards
        run: python scripts/publish_dashboard_serving_shards.py --shard-rows 500
