name: Audit T1 multi-pivot arbitration
on:
  workflow_dispatch:
    inputs:
      t1_run_id:
        required: true
        default: "35433809906"
  push:
    branches: [audit/t1-multipivot-arbitration-17sep]
    paths: [.github/dispatch/t1-multipivot-arbitration-17sep]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      T1_RUN_ID: ${{ inputs.t1_run_id || '35433809906' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: t1-execution-${{ env.T1_RUN_ID }}
          path: upstream
          run-id: ${{ env.T1_RUN_ID }}
          github-token: ${{ github.token }}
      - run: python scripts/audit_t1_multipivot_arbitration.py
      - uses: actions/upload-artifact@v4
        with:
          name: t1-multipivot-arbitration-${{ github.run_id }}
          path: audit/t1-multipivot-arbitration.json
          retention-days: 7
