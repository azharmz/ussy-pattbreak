name: Freeze canonical READY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install boto3
      - name: Freeze exact READY lineage
        run: python scripts/freeze_ready.py --output checkpoints/frozen-ready.json
      - name: Upload durable FROZEN_READY checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: frozen-ready-${{ github.run_id }}
          path: checkpoints/frozen-ready.json
          if-no-files-found: error
          retention-days: 30
