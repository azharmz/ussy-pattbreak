[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ussy-pattern-breakout"
version = "0.1.0"
requires-python = ">=3.11"\ndependencies = ["pandas>=2", "pyarrow>=15"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
